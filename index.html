<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাইভ বাস ট্র্যাকিং</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Top Floating Dashboard */
    .tracking-card {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      padding: 10px 18px;
      border-radius: 28px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .metric-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .metric-label {
      color: #6b7280;
    }

    .status-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .status-indicator.online {
      background-color: #16a34a;
      box-shadow: 0 0 6px #16a34a;
    }

    .status-indicator.offline {
      background-color: #dc2626;
    }

    .status-text.online {
      color: #15803d;
    }

    .status-text.offline {
      color: #6b7280;
    }

    .val-badge {
      background: #f1f5f9;
      color: #0f172a;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Floating Stats Card -->
  <div class="tracking-card">
    <div class="metric-item">
      <span id="status-indicator" class="status-indicator offline"></span>
      <span id="status-text" class="status-text offline">বাস অফলাইন</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">দূরত্ব:</span>
      <span id="distance" class="val-badge">--</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">সময়:</span>
      <span id="eta" class="val-badge">--</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxp2og-Jn6gIctpj80MfKWZaxvpLBEru0&callback=initMap" async defer></script>

  <script>
    // Firebase initialization
    const firebaseConfig = {
      databaseURL: "https://uni-bus-tracking-f0535-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cache DOM references
    const statusDot = document.getElementById("status-indicator");
    const statusText = document.getElementById("status-text");
    const distanceVal = document.getElementById("distance");
    const etaVal = document.getElementById("eta");

    let map;
    let busMarker = null;
    let userMarker = null;
    let userCoords = null;
    let lastEtaCheck = 0;

    function initMap() {
      const defaultCenter = { lat: 24.8949, lng: 91.8687 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: defaultCenter,
        disableDefaultUI: true,
        zoomControl: true
      });

      busMarker = new google.maps.Marker({
        position: defaultCenter,
        map: map,
        title: "University Bus",
        icon: {
          url: "https://maps.google.com/mapfiles/kml/shapes/bus.png",
          scaledSize: new google.maps.Size(38, 38)
        }
      });

      // User geolocation handler
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            userMarker = new google.maps.Marker({
              position: userCoords,
              map: map,
              title: "Your Location",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 6,
                fillColor: "#2563eb",
                fillOpacity: 1,
                strokeWeight: 2,
                strokeColor: "#ffffff"
              }
            });
          },
          (err) => {
            console.warn("Location permission denied or unavailable:", err.message);
          }
        );
      }

      // Start listening to bus updates
      listenToBusLocation();
    }

    // ETA & Distance matrix calculations
    function updateRouteDetails(busPos) {
      if (!userCoords) return;

      const now = Date.now();
      if (now - lastEtaCheck < 10000) return; // 10-second throttle
      lastEtaCheck = now;

      const service = new google.maps.DistanceMatrixService();
      service.getDistanceMatrix(
        {
          origins: [busPos],
          destinations: [userCoords],
          travelMode: google.maps.TravelMode.DRIVING
        },
        (response, status) => {
          if (status === "OK" && response.rows[0]?.elements[0]?.status === "OK") {
            const data = response.rows[0].elements[0];
            distanceVal.innerText = data.distance.text;
            etaVal.innerText = `~${data.duration.text}`;
          }
        }
      );
    }

    // Realtime Database listener
    function listenToBusLocation() {
      db.ref("buses/bus_01").on("value", (snapshot) => {
        const data = snapshot.val();

        if (!data || data.status !== "ACTIVE") {
          statusDot.className = "status-indicator offline";
          statusText.className = "status-text offline";
          statusText.innerText = "বাস অফলাইন";
          distanceVal.innerText = "--";
          etaVal.innerText = "--";
          return;
        }

        statusDot.className = "status-indicator online";
        statusText.className = "status-text online";
        statusText.innerText = "বাস লাইভ";

        const busPos = new google.maps.LatLng(data.lat, data.lng);
        busMarker.setPosition(busPos);
        map.panTo(busPos);

        updateRouteDetails(busPos);
      });
    }
  </script>
</body>
</html>
