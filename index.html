<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইউনিভার্সিটি বাস ট্র্যাকিং</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #e5e7eb; }
    
    #map { height: 100vh; width: 100vw; }

    /* ফ্লোটিং স্ট্যাটাস কার্ড */
    #info-card {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      width: 90%;
      max-width: 420px;
      justify-content: space-between;
      border: 1px solid rgba(229, 231, 235, 0.8);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .online { background-color: #16a34a; box-shadow: 0 0 8px #16a34a; }
    .offline { background-color: #dc2626; }

    .stat-pill {
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div id="info-card">
    <div class="badge">
      <span id="status-indicator" class="status-dot offline"></span>
      <span id="status-text" style="color: #64748b;">বাস অফলাইন</span>
    </div>
    <div class="badge">
      <span style="color: #64748b;">দূরত্ব:</span>
      <span id="distance" class="stat-pill">--</span>
    </div>
    <div class="badge">
      <span style="color: #64748b;">সময়:</span>
      <span id="eta" class="stat-pill">--</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Google Maps SDK (শুধুমাত্র ম্যাপ প্রদর্শনের জন্য) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxp2og-Jn6gIctpj80MfKWZaxvpLBEru0&callback=initMap" async defer></script>

  <script>
    firebase.initializeApp({
      databaseURL: "https://uni-bus-tracking-f0535-default-rtdb.firebaseio.com"
    });
    const db = firebase.database();

    let map, busMarker, userMarker;
    let userCoords = null;
    let lastEtaCheck = 0;

    function initMap() {
      const defaultCenter = { lat: 24.8949, lng: 91.8687 };
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: defaultCenter,
        disableDefaultUI: true,
        zoomControl: true
      });

      busMarker = new google.maps.Marker({
        position: defaultCenter,
        map: map,
        title: "ইউনিভার্সিটি বাস",
        icon: {
          url: "https://maps.google.com/mapfiles/kml/shapes/bus.png",
          scaledSize: new google.maps.Size(38, 38)
        }
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          userMarker = new google.maps.Marker({
            position: userCoords,
            map: map,
            title: "আপনার অবস্থান",
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 7,
              fillColor: "#2563eb",
              fillOpacity: 1,
              strokeWeight: 2,
              strokeColor: "#ffffff"
            }
          });
        });
      }

      trackBus();
    }

    // হাইব্রিড সমাধান: ব্যাকগ্রাউন্ডে ফ্রি OSRM দিয়ে দূরত্ব ও সময় নির্ণয়
    async function updateRouteDetails(busLat, busLng) {
      if (!userCoords) return;

      const now = Date.now();
      // ৩০ সেকেন্ডের ব্যবধান (Interval: 30,000 ms)
      if (now - lastEtaCheck < 30000) return;
      lastEtaCheck = now;

      // OSRM পাবলিক রাউটিং কল (সম্পূর্ণ ফ্রি)
      const url = `https://router.project-osrm.org/route/v1/driving/${busLng},${busLat};${userCoords.lng},${userCoords.lat}?overview=false`;

      try {
        const response = await fetch(url);
        const resData = await response.json();
        if (resData.routes && resData.routes.length > 0) {
          const route = resData.routes[0];
          const distKm = (route.distance / 1000).toFixed(1);
          const durationMin = Math.ceil(route.duration / 60);

          document.getElementById('distance').innerText = `${distKm} কিমি`;
          document.getElementById('eta').innerText = `~${durationMin} মি.`;
        }
      } catch (err) {
        console.error("OSRM ফেচ ব্যর্থ হয়েছে:", err);
      }
    }

    function trackBus() {
      db.ref("buses/bus_01").on("value", (snapshot) => {
        const data = snapshot.val();
        const dot = document.getElementById("status-indicator");
        const text = document.getElementById("status-text");

        if (!data || data.status !== "ACTIVE") {
          dot.className = "status-dot offline";
          text.innerText = "বাস অফলাইন";
          text.style.color = "#64748b";
          document.getElementById("distance").innerText = "--";
          document.getElementById("eta").innerText = "--";
          return;
        }

        dot.className = "status-dot online";
        text.innerText = "বাস লাইভ";
        text.style.color = "#16a34a";

        const busPos = new google.maps.LatLng(data.lat, data.lng);
        busMarker.setPosition(busPos);
        map.panTo(busPos);

        // OSRM কল করা হচ্ছে বাসের বর্তমান lat, lng পাঠিয়ে
        updateRouteDetails(data.lat, data.lng);
      });
    }
  </script>
</body>
</html>
